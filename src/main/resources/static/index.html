<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MediRemind</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/main.css"><link rel="stylesheet" href="/css/auth.css"></head><body class="auth-page"><section class="auth-card"><div class="auth-logo">💊 MediRemind</div><div class="tabs"><button class="tab active" data-tab="login">Login</button><button class="tab" data-tab="register">Register</button></div><form id="loginForm" class="auth-form"><label>Username<input name="username" required autocomplete="username"></label><label>Password<div class="password-wrap"><input name="password" type="password" required autocomplete="current-password"><button class="icon-btn" type="button" data-eye>◉</button></div></label><button class="btn auth-submit">Sign in</button></form><form id="registerForm" class="auth-form hidden"><label>Username<input name="username" required minlength="3"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password<div class="password-wrap"><input name="password" type="password" required minlength="8" autocomplete="new-password"><button class="icon-btn" type="button" data-eye>◉</button></div></label><button class="btn auth-submit">Create account</button></form><div id="notice" class="notice"></div></section><script src="/js/api.js"></script><script src="/js/auth.js"></script></body></html>
