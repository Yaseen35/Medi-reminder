<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | MediRemind</title><link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/css/main.css"><link rel="stylesheet" href="/css/components.css"><link rel="stylesheet" href="/css/dashboard.css"></head><body><div class="app" id="celebration"><header class="topbar"><a class="brand" href="/dashboard.html">💊 <span>Medi</span>Remind</a><div class="right"><select id="profileSelect" class="select"></select><button class="icon-btn" id="soundToggle" title="Toggle Sound">🔔 Sound ON</button><button class="icon-btn hidden" id="installApp" title="Install App">📲 Install</button><span data-user></span><button class="icon-btn" data-logout title="Sign out">↪</button></div></header><aside class="sidebar"><a class="nav-link active" href="/dashboard.html">⌂ Dashboard</a><a class="nav-link" href="/medicines.html">💊 Medicines</a><a class="nav-link" href="/reminders.html">⏰ Reminders</a><a class="nav-link" href="/history.html">📋 History</a><a class="nav-link" href="/profiles.html">👥 Profiles</a></aside><main><div class="page-head"><div><h1>Today's schedule</h1><p class="muted" id="today"></p></div></div><section class="card streak-card"><div class="streak-fire">🔥</div><div><strong id="streakDays">0-Day Streak</strong><p id="streakCopy">Take today's doses to start a streak.</p></div></section><section id="stockAlerts"></section><section class="stats grid"><article class="card stat"><span class="muted">Total</span><div class="num total" id="total">0</div></article><article class="card stat"><span class="muted">Taken</span><div class="num taken" id="taken">0</div></article><article class="card stat"><span class="muted">Pending</span><div class="num pending" id="pending">0</div></article><article class="card stat"><span class="muted">Missed</span><div class="num missed" id="missed">0</div></article></section><section class="card"><div class="page-head" style="padding:20px 22px 0"><h2 style="margin:0;font-size:18px">Medication timeline</h2></div><div id="timeline" class="timeline"></div></section></main></div><script src="/js/api.js"></script><script src="/js/dashboard.js"></script><script>let installPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;installApp.classList.remove('hidden')});installApp.onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installApp.classList.add('hidden')}};if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');</script></body></html>
