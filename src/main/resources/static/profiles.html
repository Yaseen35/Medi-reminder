<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profiles | MediRemind</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/main.css"><link rel="stylesheet" href="/css/components.css"><link rel="stylesheet" href="/css/medicines.css"></head><body><div class="app"><header class="topbar"><a class="brand" href="/dashboard.html">💊 <span>Medi</span>Remind</a><div class="right"><span data-user></span><button class="icon-btn" data-logout>↪</button></div></header><aside class="sidebar"><a class="nav-link" href="/dashboard.html">⌂ Dashboard</a><a class="nav-link" href="/medicines.html">💊 Medicines</a><a class="nav-link" href="/reminders.html">⏰ Reminders</a><a class="nav-link" href="/history.html">📋 History</a><a class="nav-link active" href="/profiles.html">👥 Profiles</a></aside><main><div class="page-head"><div><h1>Family profiles</h1><p class="muted">Keep each person's medicines separate.</p></div></div><section id="profileGrid" class="grid profile-grid"></section><button class="btn add-fab" id="add">＋</button></main></div><div id="modalRoot"></div><script src="/js/api.js"></script><script>initShell();let profiles=[];async function load(){try{profiles=await(await apiFetch('/profiles')).json();profileGrid.innerHTML=profiles.length?profiles.map(p=>`<article class="card profile-card"><div class="pill" style="background:#4F7EFF;font-size:24px;--pill-glow:rgba(79,126,255,0.55)">${escapeHtml(p.avatar||'💊')}</div><h3>${escapeHtml(p.name)}</h3><span class="chip">${escapeHtml(p.relation)}</span><div class="actions"><button class="btn danger" onclick="del(${p.id})">Delete</button></div></article>`).join(''):'<div class="empty"><div class="symbol">👨‍👩‍👧</div>Create your first family profile.</div>'}catch(e){profileGrid.innerHTML=`<div class="empty">${escapeHtml(e.message)}</div>`}}function openForm(){modalRoot.innerHTML=`<div class="modal-backdrop"><form class="modal" id="profileForm"><h2>Add profile</h2><div class="form-grid"><label>Name*<input name="name" required></label><label>Relation<select name="relation"><option>Self</option><option>Mother</option><option>Father</option><option>Sibling</option><option>Child</option><option>Other</option></select></label><label>Avatar<select name="avatar"><option>💊</option><option>🙂</option><option>👩</option><option>👨</option><option>👵</option><option>👴</option><option>👧</option><option>👦</option><option>🧑</option><option>❤️</option></select></label></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="modalRoot.innerHTML=''">Cancel</button><button class="btn">Add profile</button></div></form></div>`;profileForm.onsubmit=async e=>{e.preventDefault();try{await apiFetch('/profiles',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(profileForm)))});modalRoot.innerHTML='';load()}catch(e){alert(e.message)}}}async function del(id){if(confirm('Delete this profile? This may affect its medicine records.'))try{await apiFetch('/profiles/'+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}add.onclick=openForm;load();</script></body></html>
